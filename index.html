
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Digital Clock</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-neutral-950 flex items-center justify-center p-4">

    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3">

        <div id="hours"
            class="bg-white text-black text-4xl sm:text-7xl font-bold rounded-xl p-3 sm:p-5">
            00
        </div>

        <span class="text-white text-3xl sm:text-5xl font-bold">:</span>

        <div id="minutes"
            class="bg-white text-black text-4xl sm:text-7xl font-bold rounded-xl p-3 sm:p-5">
            00
        </div>

        <span class="text-white text-3xl sm:text-5xl font-bold">:</span>

        <div id="seconds"
            class="bg-white text-black text-4xl sm:text-7xl font-bold rounded-xl p-3 sm:p-5">
            00
        </div>

        <div id="period"
            class="text-white text-xl sm:text-2xl font-bold ml-2">
            AM
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
